[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fkguidance"
version = "0.1.0"
description = "Post-training Feynman-Kac guidance for stochastic generative models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["fkguidance"]

[tool.pytest.ini_options]
testpaths = ["fkguidance/tests"]
